name: Deploy Portfolio

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check package version
        id: version-check
        if: github.event_name == 'push'
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          PREVIOUS_VERSION=$(git show HEAD^:package.json | node -e "
            let data = '';
            process.stdin.on('data', chunk => data += chunk);
            process.stdin.on('end', () => {
              console.log(JSON.parse(data).version);
            });
          ")

          echo "Previous version: $PREVIOUS_VERSION"
          echo "Current version:  $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
            echo "Version changed. Deployment will continue."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version did not change. Skipping deployment."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.version-check.outputs.version_changed == 'true'
        run: npm ci

      - name: Build
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.version-check.outputs.version_changed == 'true'
        run: npm run build

      - name: Setup GitHub Pages
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.version-check.outputs.version_changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload build
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.version-check.outputs.version_changed == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: >
          github.event_name == 'workflow_dispatch' ||
          steps.version-check.outputs.version_changed == 'true'
        uses: actions/deploy-pages@v4
